[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rc-fragility-poc"
version = "0.1.0"
description = "Five-storey multi-bay RC SPO-to-fragility demonstration pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "joblib>=1.3,<2",
  "matplotlib>=3.7,<4",
  "numpy>=1.24,<2",
  # 3.8.0.0 currently depends on a Windows wheel requiring Python >=3.12.
  # 3.5.1.3 is the newest Windows build installable in the required 3.10 env.
  "openseespy==3.5.1.3",
  "pandas>=2.0,<3",
  "scikit-learn>=1.3,<2",
  "scipy>=1.10,<2",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
]

[project.scripts]
fragility-poc = "fragility_poc.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
